<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taskboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f6; --surface:#ffffff; --ink:#18212f; --muted:#5b6678; --line:#d8dfe8;
  --brand:#0f5c8a; --brand-ink:#ffffff; --danger:#b3261e;
  --todo:#64748b; --doing:#b45309; --done:#1f7a4d;
  --lane:#e4eaf1;
  --head:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'Figtree','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10161f; --surface:#1a2230; --ink:#e8edf4; --muted:#9aa6b8; --line:#2b3547;
    --brand:#5db3e8; --brand-ink:#0b1420; --danger:#ff8a80;
    --todo:#94a3b8; --doing:#f0a64a; --done:#5fd196; --lane:#151c28;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--body);background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.5}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.hidden{display:none!important}

/* ---------- auth ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.pitch{background:var(--brand);color:var(--brand-ink);padding:4rem 3.5rem;display:flex;flex-direction:column;justify-content:space-between}
.logo{font-family:var(--head);font-weight:800;font-size:1.4rem}
.pitch h1{font-family:var(--head);font-weight:800;font-size:clamp(2.2rem,4.5vw,3.6rem);line-height:1.05;margin:0 0 1rem;max-width:12ch}
.pitch p{max-width:36ch;margin:0;opacity:.9;font-size:1.05rem}
.lanes-preview{display:flex;gap:.5rem;margin-top:2rem}
.lanes-preview span{flex:1;height:8px;border-radius:99px;background:currentColor;opacity:.25}
.lanes-preview span:nth-child(1){opacity:.9}.lanes-preview span:nth-child(2){opacity:.55}
.formwrap{display:flex;align-items:center;justify-content:center;padding:2rem}
.form{width:100%;max-width:380px}
.form h2{font-family:var(--head);font-size:1.8rem;margin:0 0 .25rem}
.form .sub{color:var(--muted);margin:0 0 1.5rem}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--lane);border-radius:10px;padding:4px;margin-bottom:1.25rem}
.seg button{border:0;background:transparent;padding:.55rem;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
label{display:block;font-weight:600;font-size:.9rem;margin:.9rem 0 .3rem}
input[type=text],input[type=email],input[type=password]{width:100%;padding:.7rem .85rem;border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}
input:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 25%,transparent)}
.primary{width:100%;margin-top:1.4rem;padding:.8rem;border:0;border-radius:10px;background:var(--brand);color:var(--brand-ink);font-weight:600;cursor:pointer}
.primary:hover{filter:brightness(1.08)}
.primary:disabled{opacity:.6;cursor:wait}
.err{color:var(--danger);font-weight:500;min-height:1.4rem;margin:.9rem 0 0}

/* ---------- app ---------- */
.top{display:flex;align-items:center;justify-content:space-between;padding:1rem clamp(1rem,4vw,2.5rem);background:var(--surface);border-bottom:1px solid var(--line)}
.top .logo{color:var(--brand)}
.who{display:flex;align-items:center;gap:.75rem;color:var(--muted)}
.who b{color:var(--ink)}
.ghost{border:1.5px solid var(--line);background:transparent;padding:.4rem .8rem;border-radius:8px;cursor:pointer;font-weight:500}
.ghost:hover{border-color:var(--brand)}
main{max-width:1100px;margin:0 auto;padding:2rem clamp(1rem,4vw,2.5rem) 4rem}
.add{display:flex;gap:.6rem;margin-bottom:2rem}
.add input{flex:1;font-size:1.05rem;padding:.85rem 1rem}
.add .primary{width:auto;margin:0;padding:0 1.5rem;white-space:nowrap}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;align-items:start}
.lane{background:var(--lane);border-radius:14px;padding:.9rem .9rem 1rem}
.lane header{display:flex;align-items:center;gap:.6rem;padding:.1rem .3rem .8rem}
.lane h3{font-family:var(--head);font-size:1.1rem;margin:0}
.dot{width:10px;height:10px;border-radius:50%}
.count{margin-left:auto;font-weight:600;color:var(--muted);font-size:.9rem}
.task{background:var(--surface);border-left:4px solid var(--c);border-radius:8px;padding:.7rem .8rem;margin-bottom:.55rem;display:flex;gap:.5rem;align-items:flex-start;box-shadow:0 1px 0 var(--line)}
.task .t{flex:1;word-break:break-word;font-weight:500}
.done-lane .t{text-decoration:line-through;color:var(--muted)}
.acts{display:flex;gap:2px}
.acts button{border:0;background:transparent;cursor:pointer;width:30px;height:30px;border-radius:6px;color:var(--muted);font-size:1rem}
.acts button:hover{background:var(--lane);color:var(--ink)}
.acts .x:hover{color:var(--danger)}
.acts button:disabled{opacity:.25;cursor:default;background:transparent}
.empty{color:var(--muted);text-align:center;padding:1.2rem .5rem;font-size:.92rem}

@media (max-width:820px){
  .auth{grid-template-columns:1fr}
  .pitch{padding:2rem 1.5rem;min-height:auto;gap:1.5rem}
  .pitch h1{font-size:2.2rem}
  .board{grid-template-columns:1fr}
  .add{flex-direction:column}.add .primary{padding:.8rem}
}
@media (prefers-reduced-motion:no-preference){.task{transition:transform .15s}.task:hover{transform:translateX(2px)}}
</style>
</head>
<body>

<section id="auth" class="auth">
  <div class="pitch">
    <div class="logo">Taskboard</div>
    <div>
      <h1>Keep every task moving.</h1>
      <p>Add a task, move it from To do to In progress to Done, and see where everything stands.</p>
      <div class="lanes-preview" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
  </div>
  <div class="formwrap">
    <div class="form">
      <h2 id="formTitle">Welcome back</h2>
      <p class="sub" id="formSub">Log in to see your tasks.</p>
      <div class="seg" role="tablist">
        <button role="tab" id="tabLogin" aria-selected="true" onclick="setMode('login')">Log in</button>
        <button role="tab" id="tabRegister" aria-selected="false" onclick="setMode('register')">Create account</button>
      </div>
      <div id="nameRow" class="hidden"><label for="name">Name</label><input id="name" type="text" autocomplete="name"></div>
      <label for="email">Email</label><input id="email" type="email" autocomplete="email">
      <label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="At least 6 characters">
      <button class="primary" id="submitBtn" onclick="submitAuth()">Log in</button>
      <p class="err" id="err" role="alert"></p>
    </div>
  </div>
</section>

<section id="app" class="hidden">
  <div class="top">
    <div class="logo">Taskboard</div>
    <div class="who"><span>Signed in as <b id="who"></b></span><button class="ghost" onclick="logout()">Log out</button></div>
  </div>
  <main>
    <div class="add">
      <input id="title" type="text" placeholder="What needs to be done?" aria-label="New task">
      <button class="primary" onclick="addTask()">Add task</button>
    </div>
    <p class="err" id="appErr" role="alert"></p>
    <div class="board" id="board"></div>
  </main>
</section>

<script>
let token = localStorage.getItem('token');
let mode = 'login', tasks = [];
const $ = id => document.getElementById(id);
const COLS = [
  {key:'todo', label:'To do', color:'var(--todo)', empty:'Nothing waiting. Add a task above.'},
  {key:'in_progress', label:'In progress', color:'var(--doing)', empty:'Move a task here when you start it.'},
  {key:'done', label:'Done', color:'var(--done)', empty:'Finished tasks show up here.'}
];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(path, method='GET', body){
  const r = await fetch('/api'+path, {method, headers:{'Content-Type':'application/json', ...(token?{Authorization:'Bearer '+token}:{})}, body: body?JSON.stringify(body):undefined});
  if (r.status === 204) return null;
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || 'Something went wrong');
  return d;
}

function setMode(m){
  mode = m;
  const reg = m === 'register';
  $('tabLogin').setAttribute('aria-selected', !reg);
  $('tabRegister').setAttribute('aria-selected', reg);
  $('nameRow').classList.toggle('hidden', !reg);
  $('formTitle').textContent = reg ? 'Create your account' : 'Welcome back';
  $('formSub').textContent = reg ? 'It takes less than a minute.' : 'Log in to see your tasks.';
  $('submitBtn').textContent = reg ? 'Create account' : 'Log in';
  $('password').autocomplete = reg ? 'new-password' : 'current-password';
  $('err').textContent = '';
}

async function submitAuth(){
  const btn = $('submitBtn'); btn.disabled = true; $('err').textContent = '';
  try{
    const payload = {email:$('email').value.trim(), password:$('password').value};
    if (mode === 'register') payload.name = $('name').value.trim();
    const d = await api('/auth/'+mode, 'POST', payload);
    token = d.token; localStorage.setItem('token', token); init();
  }catch(e){ $('err').textContent = e.message; }
  btn.disabled = false;
}

function logout(){ localStorage.removeItem('token'); token = null; tasks = []; init(); }

async function addTask(){
  const v = $('title').value.trim(); if (!v) return;
  try{ await api('/tasks','POST',{title:v}); $('title').value=''; load(); }catch(e){ $('appErr').textContent = e.message; }
}

async function move(id, dir){
  const t = tasks.find(x => x.id === id); if (!t) return;
  const i = COLS.findIndex(c => c.key === t.status) + dir;
  if (i < 0 || i > 2) return;
  try{ await api('/tasks/'+id,'PUT',{status:COLS[i].key}); load(); }catch(e){ $('appErr').textContent = e.message; }
}
async function del(id){
  try{ await api('/tasks/'+id,'DELETE'); load(); }catch(e){ $('appErr').textContent = e.message; }
}

function render(){
  $('board').innerHTML = COLS.map((c, i) => {
    const items = tasks.filter(t => t.status === c.key);
    return `<section class="lane ${c.key==='done'?'done-lane':''}" style="--c:${c.color}">
      <header><span class="dot" style="background:${c.color}"></span><h3>${c.label}</h3><span class="count">${items.length}</span></header>
      ${items.map(t => `<div class="task"><span class="t">${esc(t.title)}</span>
        <span class="acts">
          <button ${i===0?'disabled':''} onclick="move(${t.id},-1)" aria-label="Move back" title="Move back">&#8592;</button>
          <button ${i===2?'disabled':''} onclick="move(${t.id},1)" aria-label="Move forward" title="Move forward">&#8594;</button>
          <button class="x" onclick="del(${t.id})" aria-label="Delete task" title="Delete">&#10005;</button>
        </span></div>`).join('') || `<p class="empty">${c.empty}</p>`}
    </section>`;
  }).join('');
}

async function load(){
  try{ tasks = await api('/tasks'); $('appErr').textContent=''; render(); }
  catch(e){ if (/token|Authorization/i.test(e.message)) logout(); else $('appErr').textContent = e.message; }
}

async function init(){
  if (!token){ $('auth').classList.remove('hidden'); $('app').classList.add('hidden'); return; }
  try{
    const me = await api('/auth/me');
    $('who').textContent = me.name;
    $('auth').classList.add('hidden'); $('app').classList.remove('hidden');
    load();
  }catch{ logout(); }
}
$('title').addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });
['email','password','name'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') submitAuth(); }));
init();
</script>
</body>
</html>
